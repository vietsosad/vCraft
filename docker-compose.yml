services:
  db:
    image: postgres:16-alpine
    container_name: vcraft_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vcraft
      POSTGRES_PASSWORD: vcraft
      POSTGRES_DB: vcraft
    ports:
      - "5434:5432"
    volumes:
      - vcraft_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vcraft -d vcraft"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vcraft_pgdata:
